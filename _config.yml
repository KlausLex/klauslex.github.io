# About Section
# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Hi, I'm Klaus - Vienna-based dog-lover & aspiring PhD student in fundamental research.<br>

  I was supposed to do scientific work in the field of <mark>computer vision</mark>, <mark>sensor fusion</mark> & <mark>artificial intelligence</mark>, but lack of funding had me spend most of my time doing engineering for some API work while locked down in system integration hell, barely working on some image processing tasks.
  During my studies in mechanical engineering & robotics I realized that applied research/work is not my cup of tea - and I'm much more interested in <mark>fundamental or basic reasearch</mark>.

  My research interests thus moved on to the general area of <mark>biomimetics</mark>. <br>
  More specifically, I'm interested in <mark>humanoid robotics</mark> and <mark>legged locomotion</mark>, or really any unconventional robots that are as far away from practical, industry-related work as possible.. <br>
  Tbh, I'm not that picky. I just prefer not to wither away in the industry doing some mundane engineers work and code-monkeying while paid pennies, as well as having to take <mark>PTO</mark> to watch people post about <mark>ICRA</mark>, <mark>ARSO</mark> and other robotics related conferences online - especially when they're in my hometown, and knowing, that my colleagues get paid to personally attend. <br> <br>
  If you're looking for a <mark>PhD student</mark> who's had a lot of experience in different fields and would love to go present work at<mark>ICRA</mark>, <mark>NeurIPS</mark>, <mark>ICLR</mark>, <mark>ICML</mark>, etc. and publish in journals, please reach out! <3
  

