more_content: | # this will include new lines to allow paragraphs
  
  When I'm not working, I continue my pursuit for science. <br>
  I serve as VP for the great science festival [Pint of Science Austria](https://pintofscience.at/), where I lead a team of 4 people in organizing tech-related talks by scientists to present their work at local pubs. <br>
  Additionally I coordinate and manage robotics related Mars analogue research projects at the [Austrian Space Forum](https://oewf.org/).

  The little time I have left spend on a mixture of:
   - What "little" time is left, you dummy?
   - Commuting
   - Studying
   - <s>Photography</s>  
   - <s>3D printing</s>  
   - <s>3D-Modelling in my favorite modeller <mark>BLENDER</mark> or hating on <mark>FreeCAD</mark></s>  
   - <s>Image editing in <mark>Affinity Suite</mark> and <mark>Adobe Lightroom</mark> as well as</s>  
   - <s>Video editing in <mark>Vegas</mark> and <mark>Final Cut</mark></s>  



